<style>
:root {
  --bg: #F5F1E9;
  --ink: #180900;
  --ink-mid: #5C4030;
  --taupe: #B09A84;
  --klei: #87674E;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A0E07;
    --ink: #F0E6DA;
    --ink-mid: #C4A888;
    --taupe: #8A7060;
    --klei: #C49A78;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 300;
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem 2rem;
}
.num {
  font-family: var(--serif);
  font-size: clamp(5rem, 20vw, 10rem);
  font-weight: 300;
  font-style: italic;
  color: var(--taupe);
  line-height: 1;
  margin-bottom: 1.5rem;
}
h1 {
  font-family: var(--serif);
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  font-weight: 300;
  font-style: italic;
  margin-bottom: 1rem;
}
p {
  color: var(--ink-mid);
  max-width: 38ch;
  margin-bottom: 2.5rem;
}
a {
  display: inline-block;
  font-size: 0.8125rem;
  letter-spacing: 0.06em;
  color: var(--klei);
  border-bottom: 1px solid var(--klei);
  padding-bottom: 2px;
  text-decoration: none;
  transition: opacity 0.22s;
}
a:hover { opacity: 0.7; }
</style>
</head>
<body>
<p class="num">404</p>
